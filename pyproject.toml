[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solubility-dissolution-kows-agent"
version = "2.1.0"
description = "Experimental physicochemical screening calculator with legacy task audit tools"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.scripts]
solubility-dissolution-kows-agent = "solubility_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/solubility-dissolution-kows-agent"
Repository = "https://github.com/abusuraihsakhri/solubility-dissolution-kows-agent.git"

[tool.setuptools.packages.find]
include = ["agents*", "solubility_mind*"]
